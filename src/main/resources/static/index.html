<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PeopleOps · HR & Payroll</title><style>
:root{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#1e3046;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:247px;background:#12273d;color:white;padding:28px 16px;flex-shrink:0}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px;padding:0 14px 26px}.brand span{color:#57dfbf}.small{font-size:11px;letter-spacing:2px;color:#9fb2c3;padding:8px 14px 14px}nav button{display:block;border:0;background:transparent;color:#bfd0df;padding:13px 16px;width:100%;text-align:left;border-radius:10px;cursor:pointer;font-size:14px;margin:3px 0}nav button.active,nav button:hover{background:#224963;color:white}main{flex:1;min-width:0;padding:36px 44px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}h1{margin:4px 0;font-size:30px;letter-spacing:-1px}h2{font-size:18px;margin:0 0 20px}p{color:#778597;margin:0;font-size:14px}.pill{padding:8px 13px;background:#dff6ed;color:#257553;border-radius:20px;font-size:12px}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:18px;margin:26px 0}.stat{background:white;border:1px solid #e7edf3;border-radius:14px;padding:22px}.stat b{display:block;font-size:29px;margin-top:13px}.stat label{color:#778597;font-size:13px}.panel{background:white;border:1px solid #e7edf3;border-radius:14px;padding:24px;box-shadow:0 2px 8px #132c3f08}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px;flex-wrap:wrap}button.primary{background:#177f76;color:white;border:0;border-radius:9px;padding:11px 17px;cursor:pointer;font-weight:600}button.secondary{background:#f0f5f7;border:0;border-radius:8px;padding:8px 11px;cursor:pointer;color:#1c5569}.danger{color:#b94747!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{background:#f6f9fb;color:#7b8996;font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:10px}th,td{padding:14px 13px;border-bottom:1px solid #eef1f4;white-space:nowrap}td{color:#304456}input,select{border:1px solid #d7e0e8;border-radius:8px;padding:10px;font:inherit;width:100%}#search{max-width:300px}.modal{position:fixed;inset:0;background:#12283d90;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{background:white;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:28px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label.field{font-size:12px;font-weight:600;color:#536578;display:block}label.field input,label.field select{margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.notice{margin:15px 0;color:#a43d40;font-size:13px;min-height:17px}.hint{padding:14px;background:#e8f7f4;border-radius:9px;color:#336c65;font-size:13px;margin-bottom:14px}@media(max-width:850px){aside{width:76px}.brand{font-size:15px;padding:0 0 20px}nav button{font-size:0}nav button::first-letter{font-size:16px}aside .small{display:none}main{padding:20px}.statgrid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand">People<span>Ops</span></div><div class="small">WORKSPACE</div><nav id="nav"></nav><div class="small" style="margin-top:30px">TEAM B23 · DBMS</div></aside><main><header><div><p>BACSE202 / Database Systems</p><h1 id="title">Overview</h1></div><span class="pill" id="connection">Connecting...</span></header><section id="content"></section></main></div><div class="modal" id="modal"><div class="dialog"><h2 id="formtitle">New record</h2><div id="formbody"></div><div class="notice" id="formerror"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" id="savebtn" onclick="saveRecord()">Save record</button></div></div></div><script>
const meta={dashboard:{title:'Overview'},departments:{title:'Departments',fields:{department_name:'text',location:'text'}},employees:{title:'Employees',fields:{employee_name:'text',date_of_birth:'date',gender:'text',phone:'text',email:'email',address:'text',join_date:'date',designation:'text',department_id:'number'}},attendance:{title:'Attendance',fields:{employee_id:'number',attendance_date:'date',check_in_time:'text',check_out_time:'text',attendance_status:['Present','Absent','Leave']}},leaves:{title:'Leave management',fields:{employee_id:'number',leave_type:'text',from_date:'date',to_date:'date',reason:'text',leave_status:['Pending','Approved','Rejected']}},salaries:{title:'Salary structures',fields:{employee_id:'number',basic_salary:'number',allowance:'number',bonus:'number',deduction:'number',effective_from:'date'}},payroll:{title:'Payroll history',fields:{employee_id:'number',salary_id:'number',payroll_month:'number',payroll_year:'number',gross_salary:'number',total_deduction:'number',net_salary:'number',payment_date:'date'}}};
let current='dashboard',rows=[],editId=null;const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
async function request(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw Error(j.error+(j.detail?' — '+j.detail:''));return j}
async function boot(){el('nav').innerHTML=Object.entries(meta).map(([k,v])=>`<button onclick="navigate('${k}')" data-key="${k}">${v.title}</button>`).join('');try{await request('/api/health');el('connection').textContent='● Oracle JDBC connected'}catch(e){el('connection').textContent='● Database disconnected';el('connection').style.background='#fce7e7';el('connection').style.color='#a33'}navigate('dashboard')}
async function navigate(module){current=module;el('title').textContent=meta[module].title;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.key===module));el('content').innerHTML='<div class="panel">Loading live database records...</div>';try{if(module==='dashboard'){const d=await request('/api/dashboard/summary');const labels=[['employees','Total employees'],['departments','Departments'],['attendance','Attendance entries'],['pendingLeaves','Pending leaves']];el('content').innerHTML=`<div class="statgrid">${labels.map(([key,label])=>`<div class="stat"><label>${label}</label><b>${esc(d[key])}</b></div>`).join('')}</div><div class="panel"><h2>Database-powered workspace</h2><p>These figures are retrieved live from Oracle through Spring Boot JDBC. Use the sidebar to browse, add, edit and delete records.</p><div class="hint" style="margin-top:18px">Monthly net payroll saved so far: ₹${Number(d.totalNetPayroll||0).toLocaleString('en-IN')}</div></div>`}else{rows=await request('/api/'+module);renderTable()}}catch(e){el('content').innerHTML=`<div class="panel"><h2>Connection / query error</h2><div class="notice">${esc(e.message)}</div><p>Check that Oracle is running, SQL scripts have been executed and DB_URL/DB_USER/DB_PASSWORD are correct.</p></div>`}}
function renderTable(){let headers=rows.length?Object.keys(rows[0]):[...Object.keys(meta[current].fields||{})];let action=current==='payroll'?'Generate payroll':'+ Add record';el('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>${meta[current].title} <span style="color:#9aa8b4;font-weight:400">(${rows.length})</span></h2><p>Live records · Oracle Database</p></div><input id="search" placeholder="Search all columns..." oninput="filterRows()"><button class="primary" onclick="showForm()">${action}</button></div><div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h.replaceAll('_',' '))}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;filterRows()}
function filterRows(){const q=(el('search')?.value||'').toLowerCase();let match=rows.filter(row=>Object.values(row).some(v=>String(v??'').toLowerCase().includes(q)));let key=current==='departments'?'DEPARTMENT_ID':current==='employees'?'EMPLOYEE_ID':current==='attendance'?'ATTENDANCE_ID':current==='leaves'?'LEAVE_ID':current==='salaries'?'SALARY_ID':'PAYROLL_ID';let headers=rows.length?Object.keys(rows[0]):[];el('tbody').innerHTML=match.map(row=>`<tr>${headers.map(h=>`<td>${esc(row[h])}</td>`).join('')}<td>${current==='payroll'?'System generated':`<button class="secondary" onclick="showForm(${Number(row[key])})">Edit</button> <button class="secondary danger" onclick="removeRecord(${Number(row[key])})">Delete</button>`}</td></tr>`).join('')||`<tr><td colspan="${headers.length+1}">No records found</td></tr>`}
function closeModal(){el('modal').classList.remove('show')}function showForm(id=null){editId=id;el('formerror').textContent='';el('formtitle').textContent=current==='payroll'?'Generate monthly payroll':id?'Edit record':'Add record';let data=id?rows.find(r=>Number(r[(current==='departments'?'DEPARTMENT':current==='employees'?'EMPLOYEE':current==='attendance'?'ATTENDANCE':current==='leaves'?'LEAVE':current==='salaries'?'SALARY':'PAYROLL')+'_ID'])===id):{};let fields=current==='payroll'?{employee_id:'number',payroll_month:'number',payroll_year:'number'}:meta[current].fields;el('formbody').innerHTML=(current==='payroll'?'<div class="hint">Gross salary, deductions and net salary will be calculated on the server from the salary table.</div>':'')+`<div class="fields">${Object.entries(fields).map(([k,typ])=>`<label class="field">${esc(k.replaceAll('_',' '))}${Array.isArray(typ)?`<select data-field="${k}">${typ.map(option=>`<option ${data?.[k.toUpperCase()]===option?'selected':''}>${option}</option>`).join('')}</select>`:`<input data-field="${k}" type="${typ}" step="${typ==='number'?'any':''}" value="${esc(String(data?.[k.toUpperCase()]??'').substring(0,typ==='date'?10:100))}">`}</label>`).join('')}</div>`;el('modal').classList.add('show')}
async function saveRecord(){let payload={};el('formbody').querySelectorAll('[data-field]').forEach(i=>{let v=i.value.trim();if(v!=='')payload[i.dataset.field]=i.type==='number'?Number(v):v});try{if(current==='payroll')await request('/api/payroll/generate',{method:'POST',body:JSON.stringify(payload)});else if(editId)await request('/api/'+current+'/'+editId,{method:'PUT',body:JSON.stringify(payload)});else await request('/api/'+current,{method:'POST',body:JSON.stringify(payload)});closeModal();navigate(current)}catch(e){el('formerror').textContent=e.message}}
async function removeRecord(id){if(!confirm('Delete this record? Oracle foreign key rules may prevent deleting referenced records.'))return;try{await request('/api/'+current+'/'+id,{method:'DELETE'});navigate(current)}catch(e){alert(e.message)}}
boot();</script></body></html>
